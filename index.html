<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home — Nebula</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-glow"></div>
    <header class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo"><img src="nebula.png" alt="Nebula Logo"></a>
        </div>
        <nav class="nav-center">
            <a href="index.html" class="nav-tab active">Home</a>
            <a href="bots.html" class="nav-tab">Bots</a>
            <a href="tools.html" class="nav-tab">Tools</a>
            <a href="hosting.html" class="nav-tab">Hosting</a>
            <a href="store.html" class="nav-tab">Store</a>
            <a href="api-keys.html" class="nav-tab">API Keys</a>
            <a href="dev.html" class="nav-tab">Developers</a>
            <a href="discord.html" class="nav-tab">Discord</a>
        </nav>
        <div class="nav-right" id="nav-auth-buttons"></div>
    </header>

    <main style="max-width: 1100px; margin: 60px auto; padding: 0 24px;">
        <!-- Hero Section -->
        <div style="text-align: center; margin-bottom: 60px;">
            <h1 style="font-size: 3rem; font-weight: 800; margin-bottom: 16px; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Build, Host & Scale with Nebula</h1>
            <p style="color: var(--text-muted); font-size: 1.15rem; max-width: 650px; margin: 0 auto 30px; line-height: 1.6;">High-performance cloud nodes, advanced AI-driven Discord bots, and developer utilities designed for seamless workflow integration.</p>
            <div style="display: flex; justify-content: center; gap: 16px;">
                <a href="store.html" class="btn-green" style="padding: 12px 24px; text-decoration:none; font-weight: 600;">Explore Store</a>
                <a href="discord.html" class="btn-outline" style="padding: 12px 24px; text-decoration:none; font-weight: 600;">Join Discord</a>
            </div>
        </div>

        <!-- Ecosystem Grid (Loaded from data.json) -->
        <h2 style="font-size: 1.5rem; margin-bottom: 24px; font-weight: 700;">Platform Ecosystem</h2>
        <div id="home-ecosystem-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-bottom: 60px;"></div>
    </main>

    <script>
        async function loadHomeData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                const grid = document.getElementById('home-ecosystem-grid');
                grid.innerHTML = '';

                // If data.json has ecosystem/bots sections
                const items = data.ecosystem || [
                    { title: "AI & Utility Bots", badge: "ECOSYSTEM", description: "Equipped with advanced modules like Nebula Ai, Code Studio, and Vedha audio systems.", link: "bots.html", linkText: "Explore Bots" },
                    { title: "NVMe Cloud Nodes", badge: "INFRASTRUCTURE", description: "Blazing fast dedicated resources with up to 16GB RAM and high-frequency vCPU cores.", link: "hosting.html", linkText: "View Hosting" },
                    { title: "Discord Hubs", badge: "COMMUNITY", description: "Join active developer communities, open priority support tickets, and manage cloud billing.", link: "discord.html", linkText: "Join Hubs" }
                ];

                items.forEach(item => {
                    grid.innerHTML += `
                        <div class="card" style="padding: 32px; display: flex; flex-direction: column; justify-content: space-between;">
                            <div>
                                <span class="card-badge">${item.badge}</span>
                                <h3 style="font-size: 1.3rem; margin-bottom: 10px;">${item.title}</h3>
                                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5;">${item.description}</p>
                            </div>
                            <a href="${item.link}" class="btn-outline" style="text-align: center; text-decoration: none; padding: 10px; font-size: 0.85rem; font-weight: 600;">${item.linkText || 'Open'}</a>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Could not load data.json", err);
            }

            const session = JSON.parse(localStorage.getItem('nebula_session'));
            document.getElementById('nav-auth-buttons').innerHTML = session ? 
                `<button onclick="localStorage.removeItem('nebula_session'); window.location.reload();" class="btn-outline" style="font-size:0.85rem; padding:6px 14px;">Logout</button>` :
                `<a href="index.html" class="btn-green" style="font-size:0.85rem; padding:6px 14px; text-decoration:none;">Login / Register</a>`;
        }

        loadHomeData();
    </script>
</body>
</html>
