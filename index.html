    <main class="hero-section">
        <div class="hero-content">
            <span class="badge">v1.0 Live</span>

            <p id="site-tagline">Empower your community with high-performance bots, web tools, and seamless custom dashboards.</p>
            <div class="hero-buttons">
                <a href="dashboard.html" class="btn-green">Open Dashboard</a>
                <a href="#items-grid" class="btn-outline">Explore Features</a>

    <!-- Filterable Content Section -->
    <section class="catalog-section" id="items-grid">
        <div class="catalog-container" id="cards-container">
            <!-- Populated dynamically via script.js -->
        </div>

    <script src="script.js"></script>
