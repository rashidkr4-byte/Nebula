<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developers — Nebula</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .discord-card {
            background-color: #111214;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #222327;
            display: flex;
            flex-direction: column;
        }
        .discord-banner {
            height: 100px;
            width: 100%;
        }
        .discord-profile-body {
            padding: 0 16px 16px 16px;
            position: relative;
            margin-top: -40px;
        }
        .discord-avatar-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 12px;
        }
        .discord-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 6px solid #111214;
            object-fit: cover;
            background-color: #2b2d31;
        }
        .discord-status-dot {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 16px;
            height: 16px;
            background-color: #23a55a;
            border: 3px solid #111214;
            border-radius: 50%;
        }
        .discord-username {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f2f3f5;
        }
        .discord-handle {
            font-size: 0.85rem;
            color: #949ba4;
            margin-bottom: 12px;
        }
        .discord-badges {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .discord-badge {
            background: #2b2d31;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #dbdee1;
            font-weight: 600;
        }
        .discord-bio {
            background: #2b2d31;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85rem;
            color: #dbdee1;
            line-height: 1.4;
            white-space: pre-line;
            border-left: 4px solid #5865F2;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <header class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo"><img src="nebula.png" alt="Nebula Logo"></a>
        </div>
        <nav class="nav-center">
            <a href="index.html" class="nav-tab">Home</a>
            <a href="bots.html" class="nav-tab">Bots</a>
            <a href="tools.html" class="nav-tab">Tools</a>
            <a href="hosting.html" class="nav-tab">Hosting</a>
            <a href="store.html" class="nav-tab">Store</a>
            <a href="api-keys.html" class="nav-tab">API Keys</a>
            <a href="dev.html" class="nav-tab active">Developers</a>
            <a href="discord.html" class="nav-tab">Discord</a>
        </nav>
        <div class="nav-right" id="nav-auth-buttons"></div>
    </header>

    <main style="max-width: 1100px; margin: 50px auto; padding: 0 24px;">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px; font-weight: 800; color: #fff;">Development Team</h1>
        <p style="color: #949ba4; font-size: 1.05rem; margin-bottom: 40px;">Meet the creators, founders, and maintainers behind Nebula.</p>

        <div id="developers-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px;"></div>
    </main>

    <script>
        const developers = [
            {
                name: "Entothic",
                handle: "entothicx",
                role: "Founder & Network Owner",
                bio: "Founder Of Nebula AI\nNetwork Owner\n# Best Bot Dev...\n🛡️ Active & Managing All Bots",
                avatar: "entothic.png",
                bannerColor: "linear-gradient(135deg, #23a55a, #5865F2)",
                badge: "OWNER"
            },
            {
                name: ".Voxion | <>",
                handle: "viperblaze0293",
                role: "Head Dev & Co-Owner",
                bio: "°•° Voxion | Dev °•°\nUnderrated Developer\nUnderrated Staff / Admin\nPushing through every obstacle.",
                avatar: "voxion.png",
                bannerColor: "linear-gradient(135deg, #5865F2, #3ba55c)",
                badge: "CO-OWNER"
            },
            {
                name: "Exe.",
                handle: "curated_.",
                role: "Network Overseer & Hosting Manager",
                bio: "Best Bot Dev ! | Best Web Dev !\nWorks:\n- Nitro Tool & Gen\n- Steam Tool & Gen",
                avatar: "exe.png",
                bannerColor: "linear-gradient(135deg, #faa61a, #ed4245)",
                badge: "MANAGER"
            }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('developers-grid');
            if (!grid) return;

            grid.innerHTML = '';
            developers.forEach(dev => {
                grid.innerHTML += `
                    <div class="discord-card">
                        <div class="discord-banner" style="background: ${dev.bannerColor};"></div>
                        <div class="discord-profile-body">
                            <div class="discord-avatar-container">
                                <img src="./${dev.avatar}" alt="${dev.name}" class="discord-avatar" onerror="console.error('Failed to load image:', '${dev.avatar}'); this.onerror=null; this.src='nebula.png';">
                                <div class="discord-status-dot"></div>
                            </div>
                            <div class="discord-username">${dev.name}</div>
                            <div class="discord-handle">@${dev.handle}</div>
                            <div class="discord-badges">
                                <span class="discord-badge">${dev.badge}</span>
                                <span class="discord-badge" style="color: #23a55a;">${dev.role}</span>
                            </div>
                            <div class="discord-bio">${dev.bio}</div>
                        </div>
                    </div>
                `;
            });

            const session = JSON.parse(localStorage.getItem('nebula_session'));
            const authContainer = document.getElementById('nav-auth-buttons');
            if (authContainer) {
                authContainer.innerHTML = session ? 
                    `<button onclick="localStorage.removeItem('nebula_session'); window.location.reload();" class="btn-outline" style="font-size:0.85rem; padding:6px 14px;">Logout</button>` :
                    `<a href="index.html" class="btn-green" style="font-size:0.85rem; padding:6px 14px; text-decoration:none;">Login / Register</a>`;
            }
        });
    </script>
</body>
</html>
